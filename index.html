<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boîte à outils Fichiers</title>
<style>
:root{
  --bg:#0b0d14; --bg2:#11141d; --card:#161a26; --card2:#1d2232;
  --border:#272d3f; --text:#eef1f7; --muted:#9aa3b8; --accent:#5b8cff; --accent2:#8b5bff;
  --ok:#3ecf8e; --err:#ff5b6a; --radius:18px;
  font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
/* fond animé ludique */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 14s ease-in-out infinite alternate}
.blob.b1{width:520px;height:520px;background:#3b6cff;top:-140px;left:-120px}
.blob.b2{width:460px;height:460px;background:#a44bff;bottom:-160px;right:-110px;animation-delay:-5s}
.blob.b3{width:380px;height:380px;background:#12b8a6;top:40%;left:60%;opacity:.22;animation-delay:-9s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
.wrap{max-width:1080px;margin:0 auto;padding:34px 22px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:13px;cursor:pointer}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 24px rgba(124,91,255,.45);
  transition:transform .3s}
.brand:hover .logo{transform:rotate(-10deg) scale(1.08)}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.2px}
.brand h1 span{background:linear-gradient(90deg,#7db0ff,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--muted);font-weight:400;display:block;font-size:12px}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.03)}
.hero{position:relative;border-radius:24px;padding:40px 34px;margin-bottom:34px;overflow:hidden;
  background:linear-gradient(135deg,rgba(91,140,255,.16),rgba(139,91,255,.14));
  border:1px solid var(--border)}
.hero .em{font-size:46px;animation:bounce 2.6s ease-in-out infinite;display:inline-block}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h2{font-size:27px;font-weight:800;margin:12px 0 8px}
.hero p{color:var(--muted);font-size:14px;max-width:560px;line-height:1.55}
.hero .fx{position:absolute;right:22px;top:18px;font-size:56px;opacity:.5;filter:blur(1px);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h2.cat{display:flex;align-items:center;gap:10px;font-size:13px;text-transform:uppercase;letter-spacing:1.6px;
  color:var(--muted);margin:34px 0 16px}
h2.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
h2.cat .dot{width:9px;height:9px;border-radius:3px;transform:rotate(45deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;cursor:pointer;overflow:hidden;transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .22s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 120px at 30% -20%,var(--tint),transparent 70%);opacity:.5}
.card:hover{transform:translateY(-6px) rotate(-.6deg);border-color:var(--tint-border);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.card .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:26px;margin-bottom:14px;background:linear-gradient(135deg,var(--tint),rgba(255,255,255,.04));
  border:1px solid var(--tint-border);transition:transform .25s}
.card:hover .ic{transform:scale(1.15) rotate(8deg)}
.card h3{font-size:15px;font-weight:700;margin-bottom:6px;position:relative}
.card p{font-size:12.5px;color:var(--muted);line-height:1.45;position:relative}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.back{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:12px;font-size:13px;transition:all .2s}
.back:hover{color:var(--text);border-color:var(--accent);transform:translateX(-3px)}
.tooltitle h2{font-size:21px;font-weight:750}
.tooltitle p{color:var(--muted);font-size:13px;margin-top:3px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.25)}
.drop{border:2px dashed var(--border);border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted);
  transition:all .2s;position:relative;overflow:hidden}
.drop.over{border-color:var(--accent);background:rgba(91,140,255,.07);color:var(--text);transform:scale(1.01)}
.drop .big{font-size:40px;margin-bottom:12px;display:inline-block;animation:bounce 2.4s ease-in-out infinite}
.drop b{color:var(--text);font-weight:600}
.flist{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.frow{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border:1px solid var(--border);
  border-radius:11px;padding:10px 14px;font-size:13px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.frow .del{background:none;border:none;color:var(--muted);font-size:15px}
.frow .del:hover{color:var(--err)}
.opt{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.opt label{font-size:12.5px;color:var(--muted);font-weight:600}
.opt input[type=text],.opt input[type=number],.opt select,.opt textarea{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:10px 13px;
  font:inherit;font-size:13.5px;width:100%;transition:border-color .2s}
.opt input:focus,.opt select:focus{outline:none;border-color:var(--accent)}
.opt input[type=range]{accent-color:var(--accent);cursor:pointer}
.optinline{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.run{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;
  padding:13px 28px;font-size:14.5px;font-weight:700;box-shadow:0 8px 24px rgba(101,120,255,.35);
  transition:transform .18s,box-shadow .18s,filter .18s}
.run:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.1);box-shadow:0 12px 30px rgba(101,120,255,.5)}
.run:active{transform:scale(.97)}
.run:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status{margin-top:12px;font-size:13px;color:var(--muted)}
.status.err{color:var(--err)}
.results{display:flex;flex-direction:column;gap:10px;animation:pop .3s ease}
.res{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;font-size:13.5px}
.res .dl{background:linear-gradient(135deg,#3ecf8e,#2bb673);color:#052b1c;text-decoration:none;font-weight:700;
  border-radius:10px;padding:8px 16px;font-size:12.5px;transition:transform .15s;display:inline-block}
.res .dl:hover{transform:scale(1.06)}
.pagesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:13px;margin-top:14px}
.pg{position:relative;border:3px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;
  transition:transform .18s,border-color .18s}
.pg:hover{transform:scale(1.04)}
.pg.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.35)}
.pg canvas{width:100%;display:block}
.pg .num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10.5px;padding:3px 8px;border-radius:7px}
.pg .tag{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(0,0,0,.75);color:#fff;font-size:10px;
  padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.drag{opacity:.35}
.pg.over{border-color:var(--ok);transform:scale(1.06)}
.pvhint{font-size:12.5px;color:var(--muted);margin-top:18px}
.signwrap{position:relative;display:inline-block;border-radius:12px;overflow:hidden;margin-top:14px;cursor:crosshair}
.signwrap canvas{display:block}
.sigpv{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.sigmodal{position:fixed;inset:0;background:rgba(5,7,12,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50}
.sigbox{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:min(580px,92vw);box-shadow:0 24px 80px rgba(0,0,0,.6)}
.sigbox h3{font-size:16px;margin-bottom:14px}
.sigbox canvas{background:#fff;border-radius:12px;width:100%;touch-action:none;cursor:crosshair}
.sigbox .row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.sigbox .ghost{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:10px 17px}
.sigbox .ghost:hover{color:var(--text);border-color:var(--muted)}
.preview{margin-top:18px;text-align:center}
.preview .frame{display:inline-block;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.preview canvas{display:block;max-width:100%}
.preview .lbl{font-size:12px;color:var(--muted);margin-top:10px}
.muted{color:var(--muted);font-size:12.5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);
  color:var(--text);padding:12px 22px;border-radius:13px;font-size:13.5px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:99;animation:pop .25s ease}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;
  animation:r 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:54px}
@media (max-width:640px){ .optinline{grid-template-columns:1fr} .hero{padding:28px 20px} }
</style>
</head>

<!-- Bibliothèques (CDN) : actives dès que le fichier est ouvert dans un navigateur / déployé sur GitHub Pages -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<div class="wrap" id="app"></div>
<footer>100 % local : vos fichiers ne quittent jamais votre navigateur. 🛡️</footer>

<script>
"use strict";
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let _libsOk = true;
if (!window.PDFLib || !window.pdfjsLib || !window.JSZip || !window.XLSX || !window.jspdf || !window.mammoth || !window.html2canvas){
  _libsOk = false;
}
const PDFDocument = window.PDFLib ? PDFLib.PDFDocument : null;
const StandardFonts = window.PDFLib ? PDFLib.StandardFonts : null;
const rgb = window.PDFLib ? PDFLib.rgb : null;
const degrees = window.PDFLib ? PDFLib.degrees : null;
function libWarn(container){
  const d = document.createElement("div"); d.className="status err";
  d.textContent = "⚠ Bibliothèques non chargées (accès CDN bloqué dans cet aperçu). Téléchargez le fichier et ouvrez-le dans votre navigateur, ou déployez-le sur GitHub Pages : tout fonctionnera.";
  container.appendChild(d);
}
const app = document.getElementById("app");
const go = (h) => { location.hash = h; };

/* ---------- utilitaires ---------- */
const fmtSize = (b) => b > 1048576 ? (b/1048576).toFixed(2)+" Mo" : (b/1024).toFixed(1)+" Ko";
const toast = (m) => { const t = document.createElement("div"); t.className="toast"; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); };
function parseRanges(str, total){
  const out = [];
  for (const part of str.split(",")){
    const p = part.trim(); if (!p) continue;
    const m = p.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m){ for (let i=+m[1]; i<=+m[2]; i++) if (i>=1 && i<=total) out.push(i-1); }
    else { const n = +p; if (n>=1 && n<=total) out.push(n-1); }
  }
  return [...new Set(out)];
}
async function loadPdf(file){
  return PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption:true });
}
async function renderThumbs(file, maxW=160){
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const thumbs = [];
  for (let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: maxW / page.getViewport({scale:1}).width });
    const c = document.createElement("canvas");
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
    thumbs.push(c);
  }
  return thumbs;
}
function dlLink(name, blob){
  const a = document.createElement("a");
  a.className="dl"; a.textContent="⬇ Télécharger"; a.href=URL.createObjectURL(blob); a.download=name;
  return a;
}
function showResults(container, outputs){
  container.innerHTML = "";
  const box = document.createElement("div"); box.className="results";
  outputs.forEach(o=>{
    const row = document.createElement("div"); row.className="res";
    const left = document.createElement("span");
    left.textContent = `${o.name} — ${fmtSize(o.blob.size)}`;
    row.append(left, dlLink(o.name, o.blob)); box.appendChild(row);
  });
  if (outputs.length > 1){
    const row = document.createElement("div"); row.className="res";
    const left=document.createElement("span"); left.innerHTML=`<b>📦 Tout télécharger</b> (${outputs.length} fichiers)`;
    const btn=document.createElement("button"); btn.className="dl"; btn.style.border="none"; btn.textContent="ZIP";
    btn.onclick = async ()=>{
      const zip = new JSZip();
      for (const o of outputs) zip.file(o.name, o.blob);
      const z = await zip.generateAsync({type:"blob"});
      row.replaceChildren(left, dlLink("fichiers.zip", z));
    };
    row.append(left, btn); box.appendChild(row);
  }
  container.appendChild(box);
}

/* ---------- zone de dépôt générique ---------- */
function makeDrop(zone, { multiple=true, accept="" }){
  let files = [];
  const list = document.createElement("div"); list.className="flist";
  zone.insertAdjacentElement("afterend", list);
  const input = document.createElement("input");
  input.type="file"; input.multiple=multiple; input.accept=accept; input.style.display="none";
  zone.insertAdjacentElement("afterend", input);
  const refresh = () => {
    list.innerHTML="";
    files.forEach((f,i)=>{
      const row=document.createElement("div"); row.className="frow";
      row.innerHTML=`<span>📄 ${f.name}</span><span class="muted">${fmtSize(f.size)}</span>`;
      const del=document.createElement("button"); del.className="del"; del.textContent="✕";
      del.onclick=()=>{ files.splice(i,1); refresh(); };
      row.append(del); list.appendChild(row);
    });
    zone.dispatchEvent(new CustomEvent("fileschange", { bubbles:true }));
  };
  zone.onclick = ()=> input.click();
  input.onchange = ()=>{ files.push(...input.files); input.value=""; refresh(); };
  zone.ondragover = e=>{ e.preventDefault(); zone.classList.add("over"); };
  zone.ondragleave = ()=> zone.classList.remove("over");
  zone.ondrop = e=>{ e.preventDefault(); zone.classList.remove("over");
    files.push(...e.dataTransfer.files.filter(f=>!accept || f.type || accept.split(",").some(a=>f.name.toLowerCase().endsWith(a.trim().split(".").pop()))));
    refresh(); };
  return { get files(){ return files; }, clear(){ files=[]; refresh(); },
    move(from,to){ const f=files.splice(from,1)[0]; files.splice(to,0,f); refresh(); }, zone };
}
const _dzHook = new WeakMap();
function dropZoneHook(drop, fn){
  if (_dzHook.has(drop)) return;
  _dzHook.set(drop, true);
  drop.zone.addEventListener("fileschange", fn);
}

/* ---------- contrôles options ---------- */
function optText(label, placeholder="", value=""){
  const d=document.createElement("div"); d.className="opt";
  d.innerHTML=`<label>${label}</label>`;
  const i=document.createElement("input"); i.type="text"; i.placeholder=placeholder; i.value=value;
  d.appendChild(i); return { el:d, get:()=>i.value, on:(ev,fn)=>i.addEventListener(ev,fn) };
}
function optNum(label, value, min=0, max=999){
  const d=document.createElement("div"); d.className="opt"; d.innerHTML=`<label>${label}</label>`;
  const i=document.createElement("input"); i.type="number"; i.value=value; i.min=min; i.max=max;
  d.appendChild(i); return { el:d, get:()=>+i.value, on:(ev,fn)=>i.addEventListener(ev,fn) };
}
function optSelect(label, options, def){
  const d=document.createElement("div"); d.className="opt"; d.innerHTML=`<label>${label}</label>`;
  const s=document.createElement("select");
  options.forEach(([v,txt])=>{ const o=document.createElement("option"); o.value=v; o.textContent=txt; if(v===def)o.selected=true; s.appendChild(o); });
  d.appendChild(s); return { el:d, get:()=>s.value, on:(ev,fn)=>s.addEventListener(ev,fn) };
}
function optRange(label, min, max, val, step=1, suffix=""){
  const d=document.createElement("div"); d.className="opt";
  d.innerHTML=`<label>${label} · <b class="rv" style="color:var(--accent)"></b></label>`;
  const i=document.createElement("input"); i.type="range"; i.min=min; i.max=max; i.step=step; i.value=val;
  const rv=d.querySelector(".rv"); rv.textContent=val+suffix;
  i.oninput=()=>{ rv.textContent=i.value+suffix; };
  d.appendChild(i); return { el:d, get:()=>+i.value, on:(ev,fn)=>i.addEventListener(ev,fn) };
}
function optCheck(label, checked){
  const d=document.createElement("div"); d.className="opt";
  const l=document.createElement("label"); l.style.cssText="display:flex;gap:9px;align-items:center;color:var(--text);font-size:13px;cursor:pointer";
  const i=document.createElement("input"); i.type="checkbox"; i.checked=checked; i.style.accentColor="var(--accent)";
  l.append(i, document.createTextNode(label)); d.appendChild(l); return { el:d, get:()=>i.checked };
}

function renderHome(){
  app.innerHTML = "";
  const head=document.createElement("header"); head.className="top";
  head.innerHTML=`<div class="brand" onclick="location.hash='#/'">
    <div class="logo">🧰</div>
    <div><h1>Boîte à outils <span>Fichiers</span></h1><small>Éditer, convertir, protéger — hors ligne</small></div>

/* --- Compresser --- */
TOOLS_IMPL.compress = function(){
  const { drop, panel } = toolPage("compress","Réduire le poids d'un PDF.",
    { accept:"application/pdf,.pdf", multiple:false });
  const mode = optSelect("Mode", [["fast","⚡ Rapide — optimisation interne (sans perte)"],["aggressive","🔥 Agressif — rasterisation (perte de qualité)"]], "fast");
  const qual = optRange("Qualité de rasterisation", 30, 95, 65, 1, " %");
  panel.append(mode.el, qual.el);
  const run=document.createElement("button"); run.className="run"; run.textContent="Compresser 🗜️";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un PDF."; return; }
    run.disabled=true; status.className="status"; status.innerHTML=`<span class="spin"></span>Compression en cours…`;
    try{
      const before = f.size; let blob;
      if (mode.get()==="fast"){
        const doc = await loadPdf(f);
        const bytes = await doc.save({ useObjectStreams:true });
        blob = new Blob([bytes], { type:"application/pdf" });
      } else {
        blob = await rasterizePdf(f, qual.get()/100);
      }
      const gain = Math.max(0, 100-blob.size/before*100).toFixed(0);
      status.innerHTML = `🎉 ${fmtSize(before)} → <b>${fmtSize(blob.size)}</b> (−${gain} %)`;
      showResults(out, [{ name: f.name.replace(/\.pdf$/i,"")+"-compressé.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};
async function rasterizePdf(file, quality){
  const src = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const outDoc = await PDFDocument.create();
  for (let i=1;i<=src.numPages;i++){
    const page = await src.getPage(i);
    const vp1 = page.getViewport({scale:1});
    const scale = Math.min(2, Math.max(1, 1400/vp1.width));
    const vp = page.getViewport({scale});
    const c = document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
    const jpg = await new Promise(r=>c.toBlob(r,"image/jpeg",quality));
    const img = await outDoc.embedJpg(await jpg.arrayBuffer());
    const p = outDoc.addPage([vp1.width, vp1.height]);
    p.drawImage(img, { x:0, y:0, width:vp1.width, height:vp1.height });
  }
  return new Blob([await outDoc.save()], { type:"application/pdf" });
}

/* --- Fusionner (avec aperçu ordonnable) --- */
TOOLS_IMPL.merge = function(){
  const { drop, panel } = toolPage("merge","Assembler plusieurs PDF en un seul — glissez les vignettes pour définir l'ordre.",
    { accept:"application/pdf,.pdf", multiple:true });
  const prevBox=document.createElement("div"); panel.appendChild(prevBox);
  const run=document.createElement("button"); run.className="run"; run.textContent="Fusionner 📎";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  const thumbCache = new Map();
  const getThumb = (f)=> thumbCache.has(f) ? Promise.resolve(thumbCache.get(f))
    : renderThumbs(f,140).then(t=>t[0]).then(c=>{ thumbCache.set(f,c); return c; }).catch(()=>null);
  const buildPrev = ()=>{
    prevBox.innerHTML="";
    const fs = drop.files;
    if (!fs.length) return;
    prevBox.innerHTML=`<div class="pvhint"><span class="spin"></span>Chargement de l'aperçu…</div>`;
    (async ()=>{
      const thumbs = await Promise.all(fs.map(getThumb));
      prevBox.innerHTML="";
      const hint=document.createElement("div"); hint.className="pvhint";
      hint.textContent="👀 Aperçu (1re page de chaque PDF) — glissez-déposez pour réordonner.";
      prevBox.appendChild(hint);
      const grid=document.createElement("div"); grid.className="pagesgrid";
      fs.forEach((f,i)=>{
        const d=document.createElement("div"); d.className="pg"; d.draggable=true; d.dataset.i=i;
        if (thumbs[i]) d.appendChild(thumbs[i]);
        else { d.style.cssText="padding:34px 8px;text-align:center;font-size:26px;background:#2a2f3e"; d.textContent="📄"; }
        const num=document.createElement("span"); num.className="num"; num.textContent="Ordre "+(i+1); d.appendChild(num);
        const nm=document.createElement("span"); nm.className="tag"; nm.textContent=f.name; d.appendChild(nm);
        d.ondragstart=e=>{ e.dataTransfer.setData("t",i); d.classList.add("drag"); };
        d.ondragend=()=>d.classList.remove("drag");
        d.ondragover=e=>{ e.preventDefault(); d.classList.add("over"); };
        d.ondragleave=()=>d.classList.remove("over");
        d.ondrop=e=>{
          e.preventDefault(); d.classList.remove("over");
          const from=+e.dataTransfer.getData("t");
          if (from===i) return;
          drop.move(from, from<i ? i-1 : i);
        };
        grid.appendChild(d);
      });
      prevBox.appendChild(grid);
    })();
  };
  dropZoneHook(drop, buildPrev);
  run.onclick = async ()=>{
    const fs = drop.files; if (fs.length<2){ status.textContent="Ajoutez au moins 2 PDF."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Fusion en cours…`;
    try{
      const doc = await PDFDocument.create();
      for (const f of fs){
        const d = await loadPdf(f);
        (await doc.copyPages(d, d.getPageIndices())).forEach(p=>doc.addPage(p));
      }
      const blob = new Blob([await doc.save({useObjectStreams:true})], { type:"application/pdf" });
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:"fusion.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

/* --- Diviser (avec aperçu du plan de découpage) --- */
TOOLS_IMPL.split = function(){
  const { drop, panel } = toolPage("split","Découper un PDF — l'aperçu montre quelles pages iront dans quel fichier.",
    { accept:"application/pdf,.pdf", multiple:false });
  const mode = optSelect("Mode", [["each","📄 Une page par fichier"],["ranges","✂️ Plages personnalisées (ex : 1-3, 4-8, 9-12)"]], "each");
  const ranges = optText("Plages","1-3, 4-8, 9-12");
  panel.append(mode.el, ranges.el);
  const prevBox=document.createElement("div"); panel.appendChild(prevBox);
  const run=document.createElement("button"); run.className="run"; run.textContent="Diviser ✂️";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  const PALETTE = ["#5b8cff","#3ecf8e","#ffb020","#ff5b6a","#8b5bff","#12b8a6","#ff7b54","#4ecdc4"];
  let total = 0;
  const buildPrev = ()=>{
    prevBox.innerHTML="";
    if (!drop.files.length){ total=0; return; }
    prevBox.innerHTML=`<div class="pvhint"><span class="spin"></span>Chargement des pages…</div>`;
    renderThumbs(drop.files[0],140).then(thumbs=>{
      total = thumbs.length;
      prevBox.innerHTML="";
      const hint=document.createElement("div"); hint.className="pvhint";
      hint.textContent="👀 Aperçu : chaque pastille indique le fichier de destination de la page.";
      prevBox.appendChild(hint);
      const grid=document.createElement("div"); grid.className="pagesgrid";
      thumbs.forEach((c,i)=>{
        const d=document.createElement("div"); d.className="pg"; d.dataset.i=i;
        d.appendChild(c);
        const num=document.createElement("span"); num.className="num"; num.textContent=i+1; d.appendChild(num);
        const tag=document.createElement("span"); tag.className="tag"; d.appendChild(tag);
        grid.appendChild(d);
      });
      prevBox.appendChild(grid);
      relabel();
    }).catch(e=> prevBox.innerHTML=`<div class="status err">Erreur : ${e.message}</div>`);
  };
  const relabel = ()=>{
    if (!total) return;
    prevBox.querySelectorAll(".pg").forEach(el=>{
      const i = +el.dataset.i;
      const tag = el.querySelector(".tag");
      if (mode.get()==="each"){
        tag.textContent=`→ fichier ${i+1}`;
        tag.style.background = "rgba(0,0,0,.75)";
        el.style.borderColor = "";
        el.classList.remove("sel");
      } else {
        const parts = ranges.get().split(",").map(s=>s.trim()).filter(Boolean);
        let found = false;
        parts.forEach((part,pi)=>{
          if (parseRanges(part, total).includes(i)){
            found = true;
            tag.textContent = `→ ${part}`;
            tag.style.background = PALETTE[pi % PALETTE.length];
            el.style.borderColor = PALETTE[pi % PALETTE.length];
            el.classList.add("sel");
          }
        });
        if (!found){
          tag.textContent = "— non inclus";
          tag.style.background = "rgba(0,0,0,.75)";
          el.style.borderColor = "";
          el.classList.remove("sel");
        }
      }
    });
  };
  dropZoneHook(drop, buildPrev);
  mode.on("change", relabel);
  ranges.on("input", relabel);
  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un PDF."; return; }
    run.disabled=true; status.className="status"; status.innerHTML=`<span class="spin"></span>Découpage…`;
    try{
      const src = await loadPdf(f);
      const base = f.name.replace(/\.pdf$/i,"");
      const outputs = [];
      if (mode.get()==="each"){
        for (let i=0;i<src.getPageCount();i++){
          const d = await PDFDocument.create();
          (await d.copyPages(src,[i])).forEach(p=>d.addPage(p));
          outputs.push({ name:`${base}-page-${i+1}.pdf`,
            blob:new Blob([await d.save()],{type:"application/pdf"}) });
        }
      } else {
        const parts = ranges.get().split(",").map(s=>s.trim()).filter(Boolean);
        for (const part of parts){
          const idxs = parseRanges(part, src.getPageCount());
          if (!idxs.length) continue;
          const d = await PDFDocument.create();
          (await d.copyPages(src, idxs)).forEach(p=>d.addPage(p));
          outputs.push({ name:`${base}-${part.replace(/\s+/g,"")}.pdf`,
            blob:new Blob([await d.save()],{type:"application/pdf"}) });
        }
        if (!outputs.length) throw new Error("aucune plage valide");
      }
      status.textContent="🎉 Terminé !";
      showResults(out, outputs);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

/* --- Pivoter (avec aperçu de la rotation) --- */
TOOLS_IMPL.rotate = function(){
  const { drop, panel } = toolPage("rotate","Faire pivoter tout ou partie des pages — l'aperçu montre la rotation en direct.",
    { accept:"application/pdf,.pdf", multiple:false });
  const angle = optSelect("Angle", [["90","↻ +90° (horaire)"],["180","↕ +180°"],["270","↺ +270° (anti-horaire)"]], "90");
  const which = optSelect("Pages", [["all","Toutes"],["range","Plage (ex : 1, 3-5)"]], "all");
  const range = optText("Pages visées","1, 3-5");
  panel.append(angle.el, which.el, range.el);
  const prevBox=document.createElement("div"); panel.appendChild(prevBox);
  const run=document.createElement("button"); run.className="run"; run.textContent="Pivoter 🔄";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  let total = 0;
  const buildPrev = ()=>{
    prevBox.innerHTML="";
    if (!drop.files.length){ total=0; return; }
    prevBox.innerHTML=`<div class="pvhint"><span class="spin"></span>Chargement des pages…</div>`;
    renderThumbs(drop.files[0],140).then(thumbs=>{
      total = thumbs.length;
      prevBox.innerHTML="";
      const hint=document.createElement("div"); hint.className="pvhint";
      hint.textContent="👀 Aperçu : les pages encadrées en bleu pivoteront.";
      prevBox.appendChild(hint);
      const grid=document.createElement("div"); grid.className="pagesgrid";
      thumbs.forEach((c,i)=>{
        const d=document.createElement("div"); d.className="pg"; d.dataset.i=i;
        const holder=document.createElement("div");
        holder.style.cssText="width:100%;transition:transform .3s;display:block";
        holder.appendChild(c);
        d.appendChild(holder);
        const num=document.createElement("span"); num.className="num"; num.textContent=i+1; d.appendChild(num);
        grid.appendChild(d);
      });
      prevBox.appendChild(grid);
      relabel();
    }).catch(e=> prevBox.innerHTML=`<div class="status err">Erreur : ${e.message}</div>`);
  };
  const relabel = ()=>{
    if (!total) return;
    const a = +angle.get();
    const idxs = which.get()==="all" ? [...Array(total).keys()] : parseRanges(range.get(), total);
    prevBox.querySelectorAll(".pg").forEach(el=>{
      const i = +el.dataset.i;
      const holder = el.firstElementChild;
      const target = new Set(idxs);
      if (target.has(i)){
        el.classList.add("sel");
        holder.style.transform = `rotate(${a}deg) scale(.82)`;
      } else {
        el.classList.remove("sel");
        holder.style.transform = "";
      }
    });
  };
  dropZoneHook(drop, buildPrev);
  angle.on("change", relabel);
  which.on("change", relabel);
  range.on("input", relabel);
  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un PDF."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Rotation…`;
    try{
      const doc = await loadPdf(f);
      const total2 = doc.getPageCount();
      const idxs = which.get()==="all" ? [...Array(total2).keys()] : parseRanges(range.get(), total2);
      if (!idxs.length) throw new Error("aucune page visée");
      idxs.forEach(i=>{
        const p = doc.getPage(i);
        p.setRotation(degrees((p.getRotation().angle + (+angle.get())) % 360));
      });
      const blob = new Blob([await doc.save({useObjectStreams:true})],{type:"application/pdf"});
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:f.name.replace(/\.pdf$/i,"")+"-pivoté.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

/* --- sélection de pages par vignettes (supprimer / extraire) --- */
function pageSelector(container, file, onChange, selectAll=false){
  container.innerHTML = `<div class="status"><span class="spin"></span>Chargement des pages…</div>`;
  const sel = new Set();
  renderThumbs(file).then(thumbs=>{
    container.innerHTML="";
    const grid=document.createElement("div"); grid.className="pagesgrid";
    thumbs.forEach((c,i)=>{
      const d=document.createElement("div"); d.className="pg"+(selectAll?" sel":"");
      if (selectAll) sel.add(i);
      d.appendChild(c);
      const num=document.createElement("span"); num.className="num"; num.textContent=i+1; d.appendChild(num);
      d.onclick=()=>{ d.classList.toggle("sel"); d.classList.contains("sel")?sel.add(i):sel.delete(i); onChange(sel); };
      grid.appendChild(d);
    });
    container.appendChild(grid);
    onChange(sel);
  }).catch(e=>{ container.innerHTML=`<div class="status err">Erreur : ${e.message}</div>`; });
  return sel;
}
function makeDelExtract(id, keep){
  return function(){
    const { drop, panel } = toolPage(id,
      keep ? "Créer un nouveau PDF à partir des pages sélectionnées."
           : "Supprimer les pages sélectionnées du PDF.",
      { accept:"application/pdf,.pdf", multiple:false });
    const hint=document.createElement("div"); hint.className="pvhint";
    hint.textContent="👆 Cliquez sur les vignettes pour les sélectionner.";
    const selBox=document.createElement("div"); selBox.style.marginTop="10px";
    panel.append(hint, selBox);
    let sel = new Set();
    const run=document.createElement("button"); run.className="run";
    run.textContent= keep ? "Extraire 📑" : "Supprimer 🗑️";
    const status=document.createElement("div"); status.className="status";
    const out=document.createElement("div");
    panel.append(run, status); app.appendChild(out);
    run.disabled=true;
    const auto = ()=>{
      selBox.innerHTML="";
      if (!drop.files.length) return;
      run.disabled=true;
      sel = pageSelector(selBox, drop.files[0], s=>{
        sel = s;
        run.disabled = s.size===0;
        status.textContent = `${s.size} page(s) sélectionnée(s)`;
      }, keep);
    };
    run.onclick = async ()=>{
      const f = drop.files[0];
      run.disabled=true; status.innerHTML=`<span class="spin"></span>Traitement…`;
      try{
        const doc = await loadPdf(f);
        const total = doc.getPageCount();
        let idxs;
        if (keep) idxs = [...sel].sort((a,b)=>a-b);
        else { const rm=new Set(sel); idxs=[...Array(total).keys()].filter(i=>!rm.has(i)); }
        const d = await PDFDocument.create();
        (await d.copyPages(doc, idxs)).forEach(p=>d.addPage(p));
        const blob = new Blob([await d.save({useObjectStreams:true})],{type:"application/pdf"});
        status.textContent="🎉 Terminé !";
        showResults(out, [{ name:f.name.replace(/\.pdf$/i,"")+(keep?"-extrait":"-allégé")+".pdf", blob }]);
      }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
      run.disabled=false;
    };
    dropZoneHook(drop, auto); auto();
  };
}
TOOLS_IMPL.deletepages = makeDelExtract("deletepages", false);
TOOLS_IMPL.extractpages = makeDelExtract("extractpages", true);

TOOLS_IMPL.organize = function(){

    { accept:"application/pdf,.pdf", multiple:false });
  const selBox=document.createElement("div"); panel.appendChild(selBox);

    renderThumbs(drop.files[0]).then(thumbs=>{
      selBox.innerHTML="";

      hint.textContent="👀 Glissez-déposez les vignettes pour réordonner — ✕ retire une page.";
      selBox.appendChild(hint);
      const grid=document.createElement("div"); grid.className="pagesgrid";
      order = thumbs.map((_,i)=>i);
      thumbs.forEach((c,i)=>{
        const d=document.createElement("div"); d.className="pg"; d.draggable=true; d.dataset.i=i;
        d.appendChild(c);
        const num=document.createElement("span"); num.className="num"; num.textContent="?"; d.appendChild(num);
        d.ondragstart=e=>{ e.dataTransfer.setData("t",i); d.classList.add("drag"); };

        d.ondrop=e=>{
          e.preventDefault(); d.classList.remove("over");
          const from=+e.dataTransfer.getData("t");
          order.splice(order.indexOf(from),1);
          order.splice(order.indexOf(+d.dataset.i)+0,0,from);

    run.disabled=true; status.innerHTML=`<span class="spin"></span>Traitement…`;

      (await d.copyPages(src, order)).forEach(p=>d.addPage(p));
      const blob = new Blob([await d.save({useObjectStreams:true})],{type:"application/pdf"});
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:f.name.replace(/\.pdf$/i,"")+"-réorganisé.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }

/* --- Signer (taille ajustable en direct) --- */
TOOLS_IMPL.sign = function(){
  const { drop, panel } = toolPage("sign","Dessinez votre signature, placez-la au clic, ajustez sa taille en direct.",
    { accept:"application/pdf,.pdf", multiple:false });
  const size = optRange("Taille de la signature (ajustable après placement)", 80, 340, 160, 4, " pt");
  panel.appendChild(size.el);
  const selBox=document.createElement("div"); panel.appendChild(selBox);
  const drawBtn=document.createElement("button"); drawBtn.className="run"; drawBtn.textContent="✍️ Dessiner la signature";
  drawBtn.style.marginTop="14px";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(drawBtn, status); app.appendChild(out);
  let sigBlob=null, sigUrl=null, placeAt=null, pageScale=1;

  const updatePreview = ()=>{
    const pv = selBox.querySelector(".sigpv");
    if (pv && placeAt){
      pv.style.width = size.get()+"px";
      pv.style.left = (placeAt.x*pageScale - size.get()/2)+"px";
      pv.style.top = (placeAt.y*pageScale - 24)+"px";
    }
  };
  size.on("input", updatePreview);

  const build = ()=>{
    selBox.innerHTML="";
    placeAt=null;
    if (!drop.files.length) return;
    selBox.innerHTML=`<div class="status"><span class="spin"></span>Chargement…</div>`;
    (async ()=>{
      const f = drop.files[0];
      const pdf = await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      const pageSel = optSelect("Page de signature",
        [...Array(pdf.numPages).keys()].map(i=>[String(i+1),`Page ${i+1}`]), "1");
      selBox.innerHTML=""; selBox.append(pageSel.el);
      const holder=document.createElement("div"); selBox.appendChild(holder);
      const renderPage = async ()=>{
        const page = await pdf.getPage(+pageSel.get());
        const vp1 = page.getViewport({scale:1});
        const scale = 760/vp1.width;
        const vp = page.getViewport({scale});
        const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
        await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        holder.innerHTML="";
        const wrap=document.createElement("div"); wrap.className="signwrap"; wrap.appendChild(c);
        holder.appendChild(wrap);
        const preview=document.createElement("div"); preview.className="status";
        preview.textContent = sigBlob ? "👆 Cliquez sur la page pour placer la signature." : "✍️ Dessinez d'abord votre signature.";
        holder.appendChild(preview);
        placeAt=null; pageScale=scale;
        wrap.onclick = (e)=>{
          if (!sigBlob){ toast("Dessinez d'abord votre signature."); return; }
          const r=c.getBoundingClientRect();
          placeAt={ x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale };
          wrap.querySelectorAll(".sigpv").forEach(n=>n.remove());
          const img=document.createElement("img"); img.className="sigpv"; img.src=sigUrl;
          wrap.appendChild(img);
          updatePreview();
          preview.textContent="✅ Position enregistrée — ajustez la taille, re-cliquez pour déplacer, puis générez le PDF signé.";
        };
      };
      pageSel.el.querySelector("select").onchange = renderPage;
      await renderPage();
    })().catch(e=> selBox.innerHTML=`<div class="status err">Erreur : ${e.message}</div>`);
  };
  panel.querySelector(".drop").addEventListener("fileschange", build);

  drawBtn.onclick = ()=>{
    const modal=document.createElement("div"); modal.className="sigmodal";
    modal.innerHTML=`<div class="sigbox"><h3>✍️ Dessinez votre signature</h3></div>`;
    const box=modal.querySelector(".sigbox");
    const c=document.createElement("canvas"); c.width=1000; c.height=340;
    const ctx=c.getContext("2d"); ctx.lineWidth=4.5; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0a1a3a";
    let drawing=false, has=false;
    const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
    c.onpointerdown=e=>{ drawing=true; has=true; ctx.beginPath(); ctx.moveTo(...pos(e)); };
    c.onpointermove=e=>{ if(drawing){ ctx.lineTo(...pos(e)); ctx.stroke(); } };
    window.addEventListener("pointerup", ()=>drawing=false, {once:false});
    const row=document.createElement("div"); row.className="row";
    const clr=document.createElement("button"); clr.className="ghost"; clr.textContent="🗑 Effacer";
    clr.onclick=()=>{ ctx.clearRect(0,0,c.width,c.height); has=false; };
    const ok=document.createElement("button"); ok.className="run"; ok.textContent="✔ Utiliser";
    ok.onclick=async ()=>{
      if (!has){ toast("Signature vide."); return; }
      sigBlob = await new Promise(r=>c.toBlob(r,"image/png"));
      sigUrl = URL.createObjectURL(sigBlob);
      modal.remove(); toast("Signature prête — cliquez sur la page.");
      status.textContent="✍️ Signature prête.";
    };
    row.append(clr, ok); box.append(c, row);
    modal.onclick=e=>{ if(e.target===modal) modal.remove(); };
    document.body.appendChild(modal);
  };
  const run=document.createElement("button"); run.className="run"; run.textContent="Générer le PDF signé ✅";
  run.style.marginLeft="10px";
  panel.appendChild(run);
  run.onclick = async ()=>{
    const f = drop.files[0];
    if (!f){ toast("Ajoutez un PDF."); return; }
    if (!sigBlob || !placeAt){ status.className="status err"; status.textContent="Signature ou position manquante."; return; }
    run.disabled=true; status.className="status"; status.innerHTML=`<span class="spin"></span>Génération…`;
    try{
      const doc = await loadPdf(f);
      const img = await doc.embedPng(await sigBlob.arrayBuffer());
      const pageNum = +panel.querySelector("select").value;
      const page = doc.getPage(pageNum-1);
      const w = size.get(), h = w*img.height/img.width;
      page.drawImage(img, { x:placeAt.x-w/2, y:page.getHeight()-placeAt.y-h/2, width:w, height:h, opacity:0.92 });
      const blob = new Blob([await doc.save({useObjectStreams:true})],{type:"application/pdf"});
      status.textContent="🎉 PDF signé !";
      showResults(out, [{ name:f.name.replace(/\.pdf$/i,"")+"-signé.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
  build();
};

/* --- Filigraner (multi-styles + aperçu en direct) --- */
TOOLS_IMPL.watermark = function(){
  const { drop, panel } = toolPage("watermark","Choisissez un style de filigrane — l'aperçu se met à jour en direct.",
    { accept:"application/pdf,.pdf", multiple:false });
  const style = optSelect("Style de filigrane", [
    ["diago","📐 Diagonal — texte en travers de la page"],
    ["mosaic","🧱 Mosaïque — texte répété sur toute la page"],
    ["bandeau","📊 Bandeau — texte discret en bas de page"],
    ["tampon","🔴 Tampon — encadré incliné façon sceau"],
  ], "diago");
  const txt = optText("Texte du filigrane","CONFIDENTIEL","CONFIDENTIEL");
  const size = optRange("Taille de police", 14, 120, 48, 2, " pt");
  const opa = optRange("Opacité", 5, 100, 22, 1, " %");
  const angle = optRange("Rotation", 0, 90, 45, 1, "°");
  const col = optSelect("Couleur", [["gray","Gris"],["red","Rouge"],["blue","Bleu"],["black","Noir"]], "gray");
  const inline=document.createElement("div"); inline.className="optinline";
  inline.append(size.el, opa.el, angle.el, col.el);
  panel.append(style.el, txt.el, inline);
  const preview=document.createElement("div"); preview.className="preview";
  preview.innerHTML=`<div class="lbl">👀 Ajoutez un PDF pour voir l'aperçu en direct (page 1).</div>`;
  const status=document.createElement("div"); status.className="status";
  const run=document.createElement("button"); run.className="run"; run.textContent="Filigraner 💧";
  const out=document.createElement("div");
  panel.append(preview, run, status); app.appendChild(out);

  const COLORS = { gray:"#8c8c99", red:"#d92626", blue:"#3351cc", black:"#000000" };
  let baseImg=null, dispC=null, pageSize=[595,842];

  /* dessine l'aperçu sur canvas 2D en imitant le rendu final */
  const drawPreview = ()=>{
    if (!dispC || !baseImg) return;
    const c = dispC;
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height);
    ctx.drawImage(baseImg, 0, 0, c.width, c.height);
    const s = txt.get().toUpperCase() || "…";
    const fsize = size.get() * c.width / pageSize[0];
    const color = COLORS[col.get()];
    ctx.globalAlpha = opa.get()/100;
    ctx.fillStyle = color; ctx.strokeStyle = color;
    ctx.font = `bold ${fsize}px sans-serif`;
    const tw = ctx.measureText(s).width;
    const mode = style.get();
    if (mode==="diago"){
      ctx.save();
      ctx.translate(c.width/2, c.height/2);
      ctx.rotate(-angle.get()*Math.PI/180);
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s, 0, 0);
      ctx.restore();
    } else if (mode==="mosaic"){
      const stepX = tw + fsize*2.2, stepY = fsize*3.4;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      for (let y=-fsize; y<c.height+stepY; y+=stepY){
        for (let x=0; x<c.width+stepX; x+=stepX){
          ctx.save(); ctx.translate(x,y); ctx.rotate(-angle.get()*Math.PI/180);
          ctx.fillText(s, 0, 0); ctx.restore();
        }
      }
    } else if (mode==="bandeau"){
      ctx.textAlign="left"; ctx.textBaseline="alphabetic";
      ctx.fillText(s, fsize*.8, c.height - fsize*.8);
    } else if (mode==="tampon"){
      ctx.save();
      ctx.translate(c.width/2, c.height/2);
      ctx.rotate(-12*Math.PI/180);
      const pad = fsize*.45, bw = tw+pad*2, bh = fsize*1.35+pad*2;
      ctx.lineWidth = Math.max(2, fsize*.09);
      ctx.strokeRect(-bw/2, -bh/2, bw, bh);
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };

  const build = ()=>{
    preview.innerHTML=""; baseImg=null; dispC=null;
    if (!drop.files.length){
      preview.innerHTML=`<div class="lbl">👀 Ajoutez un PDF pour voir l'aperçu en direct (page 1).</div>`;
      return;
    }
    preview.innerHTML=`<div class="status" style="text-align:left"><span class="spin"></span>Chargement…</div>`;
    (async ()=>{
      const f = drop.files[0];
      const pdf = await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      const page = await pdf.getPage(1);
      const vp1 = page.getViewport({scale:1});
      pageSize = [vp1.width, vp1.height];
      const vp = page.getViewport({ scale: 640/vp1.width });
      const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      baseImg = document.createElement("canvas");
      baseImg.width=c.width; baseImg.height=c.height;
      baseImg.getContext("2d").drawImage(c,0,0);
      preview.innerHTML=`<div class="lbl">👀 Aperçu en direct (page 1) — chaque réglage se répercute immédiatement.</div>`;
      const frame=document.createElement("div"); frame.className="frame";
      dispC = document.createElement("canvas");
      dispC.width=baseImg.width; dispC.height=baseImg.height;
      dispC.style.maxWidth="100%";
      frame.appendChild(dispC);
      preview.appendChild(frame);
      drawPreview();
    })().catch(e=>{ preview.insertAdjacentHTML("beforeend", `<div class="status err">Erreur : ${e.message}</div>`); });
  };
  panel.querySelector(".drop").addEventListener("fileschange", build);
  [style, txt, size, opa, angle, col].forEach(o=>{ o.on("input", drawPreview); o.on("change", drawPreview); });

  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un PDF."; return; }
    if(!txt.get().trim()){ status.textContent="Saisissez un texte."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Traitement…`;
    try{
      const doc = await loadPdf(f);
      const font = await doc.embedFont(StandardFonts.HelveticaBold);
      const s = txt.get().toUpperCase();
      const o = opa.get()/100, fs = size.get(), rot = angle.get();
      const colors = { gray:rgb(.55,.55,.6), red:rgb(.85,.15,.2), blue:rgb(.2,.3,.85), black:rgb(0,0,0) };
      const color = colors[col.get()];
      const tw = font.widthOfTextAtSize(s, fs);
      const mode = style.get();
      doc.getPages().forEach(p=>{
        const pw = p.getWidth(), ph = p.getHeight();
        if (mode==="diago"){
          p.drawText(s, {
            x: pw/2 - (tw/2)*Math.cos(rot*Math.PI/180),
            y: ph/2,
            size:fs, font, color, opacity:o, rotate:degrees(rot),
          });
        } else if (mode==="mosaic"){
          const stepX = tw + fs*2.2, stepY = fs*3.4;
          for (let y=0; y<ph+stepY; y+=stepY){
            for (let x=-stepX/2; x<pw+stepX; x+=stepX){
              p.drawText(s, { x, y, size:fs, font, color, opacity:o, rotate:degrees(rot) });
            }
          }
        } else if (mode==="bandeau"){
          p.drawText(s, { x: fs*.8, y: fs*1.1, size:fs, font, color, opacity:o });
        } else if (mode==="tampon"){
          const pad = fs*.45, bw = tw+pad*2, bh = fs*1.35+pad*2;
          const cx = pw/2, cy = ph/2;
          p.drawRectangle({
            x: cx-bw/2, y: cy-bh/2, width: bw, height: bh,
            borderColor: color, borderWidth: Math.max(1.5, fs*.09), borderOpacity: o,
          });
          p.drawText(s, {
            x: cx-tw/2, y: cy-fs*.5, size:fs, font, color, opacity:o,
          });
        }
      });
      const blob = new Blob([await doc.save({useObjectStreams:true})],{type:"application/pdf"});
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:f.name.replace(/\.pdf$/i,"")+"-filigrane.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

/* ================= CONVERSIONS VERS PDF ================= */

TOOLS_IMPL.docx2pdf = function(){
  const { drop, panel } = toolPage("docx2pdf","Convertir un document Word (.docx) en PDF — rendu via le navigateur.",
    { accept:".docx", multiple:false });
  const run=document.createElement("button"); run.className="run"; run.textContent="Convertir en PDF 📝";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un .docx."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Conversion…`;
    try{
      if (!window.mammoth) throw new Error("bibliothèque non chargée (CDN bloqué) — téléchargez le fichier ou déployez-le sur GitHub Pages");
      const { value:html } = await mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() });
      const holder=document.createElement("div");
      holder.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111;padding:48px;font-family:Georgia,serif";
      holder.innerHTML = html || "<p>(document vide)</p>";
      document.body.appendChild(holder);
      const canvas = await html2canvas(holder, { scale:2, backgroundColor:"#ffffff" });
      holder.remove();
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:"pt", format:"a4" });
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      const pxPerPt = 2;
      const sliceH = Math.floor(ph*pxPerPt);
      let y = 0, first = true;
      while (y < canvas.height){
        const tmp=document.createElement("canvas");
        tmp.width = canvas.width; tmp.height = Math.min(sliceH, canvas.height-y);
        tmp.getContext("2d").drawImage(canvas, 0, y, canvas.width, tmp.height, 0, 0, canvas.width, tmp.height);
        const img = tmp.toDataURL("image/jpeg", 0.92);
        if (!first) pdf.addPage();
        pdf.addImage(img, "JPEG", 0, 0, pw, tmp.height/pxPerPt);
        y += sliceH; first = false;
      }
      const blob = pdf.output("blob");
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:f.name.replace(/\.docx$/i,"")+".pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

TOOLS_IMPL.pptx2pdf = function(){
  const { drop, panel } = toolPage("pptx2pdf","Convertir une présentation PowerPoint (.pptx) en PDF (rendu texte simplifié).",
    { accept:".pptx", multiple:false });
  const run=document.createElement("button"); run.className="run"; run.textContent="Convertir en PDF 📊";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un .pptx."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Conversion…`;
    try{
      const zip = await JSZip.loadAsync(await f.arrayBuffer());
      const slideNames = Object.keys(zip.files)
        .filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
        .sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
      if (!slideNames.length) throw new Error("aucune diapositive trouvée");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:"pt", format:"a4", orientation:"landscape" });
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      let first = true;
      for (const name of slideNames){
        const xml = await zip.file(name).async("string");
        const paras = [...xml.matchAll(/<a:p>([\s\S]*?)<\/a:p>/g)].map(m=>
          [...m[1].matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(t=>t[1]).join("")).filter(Boolean);
        if (!first) pdf.addPage();
        first = false;
        const num = name.match(/\d+/)[0];
        pdf.setFillColor(15,17,26); pdf.rect(0,0,pw,ph,"F");
        pdf.setTextColor(140,150,175); pdf.setFontSize(11);
        pdf.text(`Diapositive ${num}`, 40, 42);
        pdf.setDrawColor(91,140,255); pdf.setLineWidth(2); pdf.line(40, 54, 120, 54);
        let y = 100; let isTitle = true;
        for (const p of paras){
          pdf.setTextColor(isTitle ? 231 : 180, isTitle ? 234 : 186, isTitle ? 240 : 195);
          pdf.setFontSize(isTitle ? 26 : 14);
          const lines = pdf.splitTextToSize(p, pw-80);
          for (const ln of lines){
            if (y > ph-50){ break; }
            pdf.text(ln, 40, y); y += (isTitle?34:22);
          }
          if (isTitle) y += 10;
          isTitle = false;
        }
      }
      const blob = pdf.output("blob");
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:f.name.replace(/\.pptx$/i,"")+".pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

TOOLS_IMPL.xlsx2pdf = function(){
  const { drop, panel } = toolPage("xlsx2pdf","Convertir un classeur Excel (.xlsx/.xls/.csv) en PDF — une section par feuille.",
    { accept:".xlsx,.xls,.csv", multiple:false });
  const orient = optSelect("Orientation", [["p","📑 Portrait"],["l","📐 Paysage"]], "p");
  panel.appendChild(orient.el);
  const run=document.createElement("button"); run.className="run"; run.textContent="Convertir en PDF 📈";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  run.onclick = async ()=>{
    const f = drop.files[0]; if(!f){ status.textContent="Ajoutez d'abord un fichier."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Conversion…`;
    try{
      const wb = XLSX.read(await f.arrayBuffer(), { type:"array" });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:"pt", format:"a4", orientation: orient.get() });
      const ph = pdf.internal.pageSize.getHeight();
      let first = true;
      wb.SheetNames.forEach(sn=>{
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:false });
        if (!rows.length) return;
        if (!first) pdf.addPage();
        first = false;
        pdf.setFontSize(13); pdf.setTextColor(30);
        pdf.text(`Feuille : ${sn}`, 40, 40);
        pdf.autoTable({
          head: [rows[0].map(c=>String(c??""))],
          body: rows.slice(1).map(r=>r.map(c=>String(c??""))),
          startY: 55, margin:{ left:40, right:40 },
          styles:{ fontSize:8, cellPadding:3, textColor:40 },
          headStyles:{ fillColor:[91,140,255], textColor:255 },
          theme:"grid",
        });
        pdf.setFontSize(9); pdf.setTextColor(150);
        pdf.text(`${rows.length-1} ligne(s)`, 40, ph-25);
      });
      const blob = pdf.output("blob");
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:f.name.replace(/\.(xlsx|xls|csv)$/i,"")+".pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

TOOLS_IMPL.img2pdf = function(){
  const { drop, panel } = toolPage("img2pdf","Convertir des images JPEG / JPG / PNG en un seul PDF.",
    { accept:"image/jpeg,image/png,.jpg,.jpeg,.png", multiple:true });
  const layout = optSelect("Mise en page", [["fit","🖼️ Ajuster à la page A4 avec marges"],["orig","📐 Taille d'origine des images"]], "fit");
  panel.appendChild(layout.el);
  const run=document.createElement("button"); run.className="run"; run.textContent="Convertir en PDF 🖼️";
  const status=document.createElement("div"); status.className="status";
  const out=document.createElement("div");
  panel.append(run, status); app.appendChild(out);
  const readFileImg = (file)=> new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img); img.onerror=()=>rej(new Error("image illisible : "+file.name));
    img.src=URL.createObjectURL(file);
  });
  run.onclick = async ()=>{
    const fs = drop.files; if(!fs.length){ status.textContent="Ajoutez d'abord des images."; return; }
    run.disabled=true; status.innerHTML=`<span class="spin"></span>Conversion…`;
    try{
      const doc = await PDFDocument.create();
      for (const f of fs){
        const img = await readFileImg(f);
        const c=document.createElement("canvas");
        c.width=img.naturalWidth; c.height=img.naturalHeight;
        const isPng = /\.png$/i.test(f.name);
        c.getContext("2d").drawImage(img,0,0);
        const blob = await new Promise(r=>c.toBlob(r, isPng?"image/png":"image/jpeg", 0.92));
        const emb = isPng ? await doc.embedPng(await blob.arrayBuffer()) : await doc.embedJpg(await blob.arrayBuffer());
        if (layout.get()==="fit"){
          const [w,h] = [595.28, 841.89];
          const m=36, sc=Math.min((w-2*m)/emb.width,(h-2*m)/emb.height);
          const pw=emb.width*sc, phh=emb.height*sc;
          const page=doc.addPage([w,h]);
          page.drawImage(emb,{x:(w-pw)/2,y:(h-phh)/2,width:pw,height:phh});
        } else {
          const page=doc.addPage([emb.width, emb.height]);
          page.drawImage(emb,{x:0,y:0,width:emb.width,height:emb.height});
        }
      }
      const blob = new Blob([await doc.save({useObjectStreams:true})],{type:"application/pdf"});
      status.textContent="🎉 Terminé !";
      showResults(out, [{ name:"images.pdf", blob }]);
    }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
    run.disabled=false;
  };
};

/* ================= CONVERSIONS D'IMAGES ================= */
function makeImgConvert(id, formats){
  return function(){
    const { drop, panel } = toolPage(id, `Format de sortie : ${formats.map(f=>f[1]).join(" ou ")}.`,
      { accept:"image/*", multiple:true });
    const target = optSelect("Format de sortie", formats, formats[0][0]);
    const qual = optRange("Qualité (JPEG)", 40, 100, 90, 1, " %");
    panel.append(target.el, qual.el);
    const run=document.createElement("button"); run.className="run"; run.textContent="Convertir 🔄";
    const status=document.createElement("div"); status.className="status";
    const out=document.createElement("div");
    panel.append(run, status); app.appendChild(out);
    run.onclick = async ()=>{
      const fs = drop.files; if(!fs.length){ status.textContent="Ajoutez d'abord des images."; return; }
      run.disabled=true; status.innerHTML=`<span class="spin"></span>Conversion…`;
      const outputs=[];
      try{
        for (const f of fs){
          const img = await new Promise((res,rej)=>{ const i=new Image();
            i.onload=()=>res(i); i.onerror=()=>rej(new Error("illisible : "+f.name)); i.src=URL.createObjectURL(f); });
          const c=document.createElement("canvas");
          c.width=img.naturalWidth; c.height=img.naturalHeight;
          const ctx=c.getContext("2d");
          if (target.get()!=="png"){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); }
          ctx.drawImage(img,0,0);
          const mime = target.get()==="png" ? "image/png" : "image/jpeg";
          const blob = await new Promise(r=>c.toBlob(r, mime, qual.get()/100));
          outputs.push({ name: f.name.replace(/\.[^.]+$/,"")+"."+target.get(), blob });
        }
        status.textContent="🎉 Terminé !";
        showResults(out, outputs);
      }catch(e){ status.className="status err"; status.textContent="Erreur : "+e.message; }
      run.disabled=false;
    };
  };
}
TOOLS_IMPL.jpeg2 = makeImgConvert("jpeg2", [["jpg","JPG"],["png","PNG"]]);
TOOLS_IMPL.jpg2  = makeImgConvert("jpg2",  [["jpeg","JPEG"],["png","PNG"]]);
TOOLS_IMPL.png2  = makeImgConvert("png2",  [["jpeg","JPEG"],["jpg","JPG"]]);

/* ---------- routage ---------- */
function router(){
  const id = (location.hash || "#/").replace(/^#\//,"");
  if (!_libsOk) libWarn(app);
  if (!id) return renderHome();
  if (TOOLS_IMPL[id]) TOOLS_IMPL[id]();
  else renderHome();
}
window.addEventListener("hashchange", router);
window.addEventListener("load", router);
</script>
