<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tableau Interactif - COMPTEURS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; padding: 20px; display: flex; gap: 20px; align-items: flex-start;
    }
    #controls {
      width: 300px; background: rgba(255,255,255,0.95); padding: 20px;
      border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
    }
    .control-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 14px; }
    input[type="number"] {
      width: 100%; padding: 10px; border: 2px solid #e1e5e9; border-radius: 8px;
      font-size: 16px; transition: border-color 0.3s;
    }
    input[type="number"]:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%; padding: 10px; margin: 3px 0; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    .btn-copy { background: #28a745; color: white; }
    .btn-copy:hover { background: #218838; transform: translateY(-1px); }
    .btn-paste { background: #007bff; color: white; }
    .btn-paste:hover { background: #0056b3; transform: translateY(-1px); }
    .btn-clear { background: #dc3545; color: white; }
    .btn-clear:hover { background: #c82333; transform: translateY(-1px); }
    
    /* COMPTEURS */
    .counters {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      padding: 15px; border-radius: 10px; margin: 15px 0;
      border: 2px solid #dee2e6;
    }
    .counter-item {
      display: flex; justify-content: space-between; align-items: center;
      margin: 8px 0; font-weight: 500;
    }
    .counter-label { color: #495057; }
    .counter-value {
      font-size: 20px; font-weight: 700; padding: 6px 12px;
      border-radius: 20px; min-width: 35px; text-align: center;
    }
    .counter-blue { background: linear-gradient(45deg, #2196F3, #21CBF3); color: white; }
    .counter-arrow { background: linear-gradient(45deg, #4CAF50, #45a049); color: white; }
    .counter-total { background: linear-gradient(45deg, #6f42c1, #7b2cbf); color: white; }
    
    .hint {
      font-size: 11px; color: #666; margin-top: 6px; line-height: 1.3;
      background: #f8f9fa; padding: 10px; border-radius: 6px;
    }
    #game-container {
      flex: 1; max-width: 800px; background: rgba(255,255,255,0.95);
      padding: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }
    #board {
      border-collapse: collapse; margin: 0 auto 20px; background: #fff;
      border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: relative;
    }
    #board td {
      width: 65px; height: 65px; border: 2px solid #e0e0e0;
      text-align: center; vertical-align: middle; position: relative;
      background: #fafafa; user-select: none; cursor: default;
      transition: all 0.2s ease;
    }
    #board td:not(.active):hover { background: #f0f8ff; }
    #board td.active {
      background: linear-gradient(45deg, #ffd700, #ffed4e) !important;
      box-shadow: inset 0 0 12px rgba(255,215,0,0.6), 0 0 20px rgba(255,215,0,0.4);
      z-index: 10; border-color: #ffaa00 !important; transform: scale(1.05);
    }
    .symbol {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 40px; height: 40px; line-height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold;
    }
    .arrow-up { background: linear-gradient(180deg, #4CAF50, #45a049); color: white; box-shadow: 0 4px 12px rgba(76,175,80,0.5); }
    .arrow-down { background: linear-gradient(0deg, #4CAF50, #45a049); color: white; box-shadow: 0 4px 12px rgba(76,175,80,0.5); }
    .arrow-left { background: linear-gradient(90deg, #4CAF50, #45a049); color: white; box-shadow: 0 4px 12px rgba(76,175,80,0.5); }
    .arrow-right { background: linear-gradient(-90deg, #4CAF50, #45a049); color: white; box-shadow: 0 4px 12px rgba(76,175,80,0.5); }
    .circle-blue { 
      background: linear-gradient(45deg, #2196F3, #21CBF3); width: 36px; height: 36px; 
      border-radius: 50%; box-shadow: 0 6px 16px rgba(33,150,243,0.5); 
      border: 4px solid rgba(255,255,255,0.9);
    }
    .cavalier-line {
      position: absolute; height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #ff1744, #ff1744, transparent);
      box-shadow: 0 0 8px rgba(255,23,68,0.8), 0 0 16px rgba(255,23,68,0.4);
      z-index: 30; pointer-events: none;
    }
    .status {
      text-align: center; margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.8);
      border-radius: 8px; font-weight: 500; font-size: 15px;
    }
    #code-display {
      background: #2d3748; color: #e2e8f0; font-family: 'Courier New', monospace;
      padding: 12px; border-radius: 8px; font-size: 12px; height: 100px;
      overflow-y: auto; user-select: all; margin-top: 10px;
      cursor: pointer; transition: all 0.3s;
    }
    #code-display:hover { box-shadow: 0 0 15px rgba(0,255,0,0.3); }
    @media (max-width: 768px) {
      body { flex-direction: column; padding: 10px; }
      #board td { width: 55px; height: 55px; }
      .symbol { width: 34px; height: 34px; line-height: 34px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="control-group">
      <label>Lignes</label>
      <input type="number" id="rows" min="3" max="15" value="8">
    </div>
    <div class="control-group">
      <label>Colonnes</label>
      <input type="number" id="cols" min="3" max="15" value="8">
    </div>
    
    <!-- COMPTEURS EN TEMPS RÉEL -->
    <div class="counters">
      <div class="counter-item">
        <span class="counter-label">🔵 Ronds bleus</span>
        <span id="count-blue" class="counter-value counter-blue">0</span>
      </div>
      <div class="counter-item">
        <span class="counter-label">➤ Flèches vertes</span>
        <span id="count-arrow" class="counter-value counter-arrow">0</span>
      </div>
      <div class="counter-item">
        <span class="counter-label">📊 Total symboles</span>
        <span id="count-total" class="counter-value counter-total">0</span>
      </div>
    </div>
    
    <div class="control-group">
      <label>📋 SAUVEGARDER</label>
      <button class="btn-copy" onclick="board.saveToClipboard()">📋 Copier Code</button>
      <button class="btn-paste" onclick="board.restoreFromPrompt()">📥 Coller Code</button>
      <button class="btn-clear" onclick="board.clearAll()">🗑️ Tout Effacer</button>
    </div>
    
    <div class="control-group">
      <label>Votre code :</label>
      <div id="code-display" onclick="this.select()">Configuration...</div>
    </div>
    
    <div class="hint">
      <strong>🎮 COMPTEURS LIVE :</strong><br>
      • Ronds bleus (o) • Flèches (h,b,g,d)<br>
      • Total symboles • Mise à jour instantanée
    </div>
  </div>

  <div id="game-container">
    <table id="board" tabindex="0"></table>
    <div id="status" class="status">↑↓←→ h/b/g/d/o - Compteurs LIVE !</div>
  </div>

  <script>
    class InteractiveBoard {
      constructor() {
        this.rows = 8; this.cols = 8;
        this.board = document.getElementById('board');
        this.status = document.getElementById('status');
        this.codeDisplay = document.getElementById('code-display');
        this.countBlue = document.getElementById('count-blue');
        this.countArrow = document.getElementById('count-arrow');
        this.countTotal = document.getElementById('count-total');
        this.cursor = { r: 0, c: 0 };
        this.cells = []; this.cavalierLines = [];
        this.init();
      }

      init() {
        this.setupControls();
        this.buildBoard();
        this.bindEvents();
        this.updateStatus();
        this.updateCounters();
        this.updateCodeDisplay();
      }

      /** COMPTEURS EN TEMPS RÉEL */
      updateCounters() {
        let blueCount = 0, arrowCount = 0, totalCount = 0;
        this.cells.flat().forEach(cell => {
          const type = cell.dataset.type;
          if (type === 'o') blueCount++;
          else if (['h','b','g','d'].includes(type)) arrowCount++;
          if (type !== '') totalCount++;
        });
        
        this.countBlue.textContent = blueCount;
        this.countArrow.textContent = arrowCount;
        this.countTotal.textContent = totalCount;
      }

      setupControls() {
        document.getElementById('rows').addEventListener('change', () => this.resize());
        document.getElementById('cols').addEventListener('change', () => this.resize());
      }

      restoreFromPrompt() {
        const code = prompt(
          '📋 COLLEZ VOTRE CODE :\n\n(Ctrl+V puis OK)',
          this.codeDisplay.textContent
        );
        if (code === null || code.trim() === '') {
          this.status.textContent = '❌ Annulé'; return;
        }
        try {
          const figure = JSON.parse(code);
          this.rows = figure.rows; this.cols = figure.cols;
          document.getElementById('rows').value = this.rows;
          document.getElementById('cols').value = this.cols;
          this.buildBoard();
          figure.cells.forEach(({r, c, type}) => {
            if (r < this.rows && c < this.cols) this.setCellType(this.cells[r][c], type);
          });
          this.checkCavalierConnections();
          this.moveCursor(0, 0);
          this.updateStatus();
          this.updateCounters();
          this.codeDisplay.textContent = code;
          this.status.textContent = '✅ Restauré !';
        } catch (e) {
          this.status.textContent = '❌ Code invalide';
        }
      }

      getFigureCode() {
        const figure = { rows: this.rows, cols: this.cols, cells: [] };
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            figure.cells.push({ r, c, type: this.cells[r][c].dataset.type });
          }
        }
        return JSON.stringify(figure, null, 2);
      }

      saveToClipboard() {
        const code = this.getFigureCode();
        navigator.clipboard.writeText(code).then(() => {
          this.status.textContent = '✅ Copié !';
          setTimeout(() => this.updateStatus(), 1500);
        });
        this.codeDisplay.textContent = code;
      }

      clearAll() {
        this.buildBoard();
        this.status.textContent = '🗑️ Effacé';
        this.updateCounters();
        this.codeDisplay.textContent = 'Vide';
      }

      buildBoard() {
        this.board.innerHTML = ''; this.cells = [];
        for (let r = 0; r < this.rows; r++) {
          const tr = document.createElement('tr');
          const rowCells = [];
          for (let c = 0; c < this.cols; c++) {
            const td = this.createCell(r, c);
            rowCells.push(td); tr.appendChild(td);
          }
          this.cells.push(rowCells); this.board.appendChild(tr);
        }
        this.moveCursor(0, 0);
        this.checkCavalierConnections();
      }

      createCell(r, c) {
        const td = document.createElement('td');
        td.dataset.row = r; td.dataset.col = c; td.dataset.type = '';
        td.tabIndex = -1; return td;
      }

      handleDirectInput(key) {
        const cell = this.cells[this.cursor.r][this.cursor.c];
        let newType = '';
        switch(key.toLowerCase()) {
          case 'h': case 'b': case 'g': case 'd': newType = key.toLowerCase(); break;
          case 'o': newType = 'o'; break; case ' ': newType = ''; break;
        }
        this.setCellType(cell, newType);
        this.checkCavalierConnections();
        this.updateCounters();
        this.updateStatus();
        this.updateCodeDisplay();
      }

      setCellType(cell, type) {
        cell.innerHTML = ''; cell.dataset.type = type;
        if (type === '') return;
        const symbol = document.createElement('div');
        symbol.className = `symbol ${this.getSymbolClass(type)}`;
        if (type === 'o') symbol.classList.add('circle-blue');
        else symbol.textContent = this.getSymbolText(type);
        cell.appendChild(symbol);
      }

      getSymbolClass(type) { return {h:'arrow-up',b:'arrow-down',g:'arrow-left',d:'arrow-right'}[type] || ''; }
      getSymbolText(type) { return {h:'↑',b:'↓',g:'←',d:'→'}[type] || ''; }

      moveCursor(r, c) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return;
        if (this.cells[this.cursor.r]) this.cells[this.cursor.r][this.cursor.c]?.classList.remove('active');
        this.cursor = { r, c };
        this.cells[r][c].classList.add('active');
        this.cells[r][c].scrollIntoView({ behavior: 'smooth', block: 'center' });
        this.updateStatus();
      }

      bindEvents() {
        this.board.addEventListener('keydown', (e) => {
          e.preventDefault();
          switch(e.key) {
            case 'ArrowUp': this.moveCursor(this.cursor.r-1,this.cursor.c);break;
            case 'ArrowDown':this.moveCursor(this.cursor.r+1,this.cursor.c);break;
            case 'ArrowLeft':this.moveCursor(this.cursor.r,this.cursor.c-1);break;
            case 'ArrowRight':this.moveCursor(this.cursor.r,this.cursor.c+1);break;
            case 'h':case'b':case'g':case'd':case'o':case'H':case'B':case'G':case'D':case'O':this.handleDirectInput(e.key);break;
            case ' ':this.handleDirectInput(' ');break;
          }
        });
        this.board.focus();
      }

      checkCavalierConnections() {
        this.clearCavalierLines();
        const blues = [];
        for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
          if (this.cells[r][c].dataset.type === 'o') blues.push({r,c,cell:this.cells[r][c]});
        }
        for (let i = 0; i < blues.length; i++) for (let j = i+1; j < blues.length; j++) {
          const p1 = blues[i], p2 = blues[j];
          const dr = Math.abs(p1.r-p2.r), dc = Math.abs(p1.c-p2.c);
          if ((dr === 1 && dc === 2) || (dr === 2 && dc === 1)) this.drawPerfectCavalierLine(p1.cell, p2.cell);
        }
      }

      drawPerfectCavalierLine(cell1, cell2) {
        const rect1 = cell1.getBoundingClientRect(), rect2 = cell2.getBoundingClientRect();
        const boardRect = this.board.getBoundingClientRect();
        const center1 = {x:rect1.left+rect1.width/2-boardRect.left,y:rect1.top+rect1.height/2-boardRect.top};
        const center2 = {x:rect2.left+rect2.width/2-boardRect.left,y:rect2.top+rect2.height/2-boardRect.top};
        const line = document.createElement('div'); line.className = 'cavalier-line';
        line.style.left = `${center1.x}px`; line.style.top = `${center1.y}px`;
        const dx = center2.x-center1.x, dy = center2.y-center1.y;
        const length = Math.sqrt(dx*dx+dy*dy), angle = Math.atan2(dy,dx)*180/Math.PI;
        line.style.width = `${length}px`; line.style.transform = `rotate(${angle}deg)`; line.style.transformOrigin = '0 50%';
        this.board.appendChild(line); this.cavalierLines.push(line);
      }

      clearCavalierLines() { this.cavalierLines.forEach(line=>line.remove()); this.cavalierLines = []; }
      resize() { this.rows=parseInt(document.getElementById('rows').value)||8; this.cols=parseInt(document.getElementById('cols').value)||8; this.buildBoard(); }
      updateStatus() {
        const cell = this.cells[this.cursor.r]?.[this.cursor.c];
        const type = cell ? cell.dataset.type : ''; const blueCount = this.cells.flat().filter(c=>c.dataset.type==='o').length;
        this.status.textContent = `(${this.cursor.r+1},${this.cursor.c+1}) ${type} | Bleus: ${blueCount}`;
      }
      updateCodeDisplay() { this.codeDisplay.textContent = this.getFigureCode(); }
    }

    const board = new InteractiveBoard(); window.board = board;
  </script>
</body>
</html>
